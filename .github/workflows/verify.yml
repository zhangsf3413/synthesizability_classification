name: Verify reproducibility assets

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-dev.txt
      - run: ruff check . && ruff format --check .
      - run: python scripts/reproduce.py verify
      - run: python -m unittest discover -s tests -v
      - run: python scripts/reproduce.py report --output runs/ci-reports
      - uses: actions/upload-artifact@v4
        with:
          name: reconstructed-metrics
          path: runs/ci-reports/
